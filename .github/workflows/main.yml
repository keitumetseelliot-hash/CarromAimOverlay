name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Fix Everything - Final Build
        run: |
          mkdir -p app/src/main/java/com/carrom/aimoverlay
          mkdir -p app/src/main/res/values
          mv -f AimOverlayView.kt app/src/main/java/com/carrom/aimoverlay/ 2>/dev/null || true
          mv -f MainActivity.kt app/src/main/java/com/carrom/aimoverlay/ 2>/dev/null || true
          mv -f OverlayService.kt app/src/main/java/com/carrom/aimoverlay/ 2>/dev/null || true
          mv -f ScreenDetector.kt app/src/main/java/com/carrom/aimoverlay/ 2>/dev/null || true

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CarromAimOverlay"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins { id("com.android.application") version "8.2.1" apply false }
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.carrom.aimoverlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.carrom.aimoverlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
                  debug { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:theme="@style/Theme.CarromAimOverlay" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:enabled="true" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources><color name="black">#000000</color><color name="white">#FFFFFF</color></resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Carrom Aim Overlay</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.CarromAimOverlay" parent="android:Theme.Material.Light.NoActionBar" /></resources>
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          -keep class com.carrom.aimoverlay.** { *; }
          EOF

          ls -R app/src/main/

      - name: Build APK
        run: gradle assembleDebug --no-configuration-cache
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarromAimOverlay-APK
          path: app/build/outputs/apk/debug/*.apk 
