name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3

      - name: Fix All Gradle Files
        run: |
          mkdir -p app/src/main/java/com/carrom/aimoverlay
          mkdir -p app/src/main/res/values

          mv -f AimOverlayView.kt app/src/main/java/com/carrom/aimoverlay/ 2>/dev/null || true
          mv -f MainActivity.kt app/src/main/java/com/carrom/aimoverlay/ 2>/dev/null || true
          mv -f OverlayService.kt app/src/main/java/com/carrom/aimoverlay/ 2>/dev/null || true
          mv -f ScreenDetector.kt app/src/main/java/com/carrom/aimoverlay/ 2>/dev/null || true
          mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv -f colors.xml app/src/main/res/values/ 2>/dev/null || true
          mv -f strings.xml app/src/main/res/values/ 2>/dev/null || true
          mv -f themes.xml app/src/main/res/values/ 2>/dev/null || true

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CarromAimOverlay"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          // Top-level build file
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.1"
          }
          android {
              namespace = "com.carrom.aimoverlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.carrom.aimoverlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  getByName("release") { isMinifyEnabled = false }
                  getByName("debug") { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          # If gradle.properties missing, create it
          if [! -f gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          fi

          echo "=== Files Created ==="
          cat settings.gradle.kts
          echo "---"
          cat app/build.gradle.kts
          echo "---"
          ls -R app/src/main

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarromAimOverlay-APK
          path: app/build/outputs/apk/debug/*.apk
