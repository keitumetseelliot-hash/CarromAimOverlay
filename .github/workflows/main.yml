name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Setup Project
        run: |
          mkdir -p app/src/main/java/com/carrom/aimoverlay
          mkdir -p app/src/main/res/values
          cp *.kt app/src/main/java/com/carrom/aimoverlay/ || true
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CarromAimOverlay"
          include(":app")' > settings.gradle.kts
          echo 'plugins { id("com.android.application") version "8.2.1" apply false }' > build.gradle.kts
          echo 'plugins { id("com.android.application") }
          android { namespace = "com.carrom.aimoverlay"; compileSdk = 34; defaultConfig { applicationId = "com.carrom.aimoverlay"; minSdk = 26; targetSdk = 34; versionCode = 4; versionName = "1.1" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }' > app/build.gradle.kts
          echo 'org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true' > gradle.properties
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" /><application android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity><service android:name=".OverlayService" /></application></manifest>' > app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">Carrom Aim</string></resources>' > app/src/main/res/values/strings.xml
          echo '<resources><style name="Theme.CarromAimOverlay" parent="android:Theme.NoTitleBar" /></resources>' > app/src/main/res/values/themes.xml
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CarromAimOverlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
